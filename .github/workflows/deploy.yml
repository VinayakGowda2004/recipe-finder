name: Deploy to AWS EC2

on:
  push:
    branches:
      - feature/docker

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/recipe-finder
            git pull origin feature/docker
            docker compose build
            docker compose up -d
            docker compose ps
